openapi: 3.0.3
info:
  title: User Management System API (SVC-001)
  version: 1.0.0
  description: >
    GET /api/v1/health, GET /api/v1/dashboard and POST /api/v1/auth/logout are implemented; every
    other operation currently returns 501 NOT_IMPLEMENTED (protected operations return 401 until a
    valid bearer token is supplied).
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { type: string, example: UNAUTHORIZED }
            message: { type: string }
            correlationId: { type: string, description: Same value as the X-Request-Id header }
    UserDTO:
      type: object
      required: [id, name, email, is_verified, account_status, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        is_verified: { type: boolean }
        account_status: { type: string, enum: [PENDING, ACTIVE, DELETED] }
        created_at: { type: string, format: date-time }
    DashboardResponse:
      type: object
      required: [user, features]
      properties:
        user: { $ref: '#/components/schemas/UserDTO' }
        features:
          type: object
          required: [delete_account_visible]
          properties:
            delete_account_visible:
              type: boolean
              enum: [true]
              description: Always true on HTTP 200; signals the client to render Delete Account.
    HealthResponse:
      type: object
      required: [status, timestamp, dependencies]
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        timestamp: { type: string, format: date-time }
        dependencies:
          type: object
          required: [database]
          properties:
            database: { type: string, example: up }
            smtp: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
    VerifyOtpRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
  responses:
    NotImplemented:
      description: Not implemented yet (scaffold)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, expired, tampered or revoked token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
paths:
  /auth/register:
    post:
      operationId: EP-API-001
      summary: Register a new user (PENDING) and dispatch an OTP email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '501': { $ref: '#/components/responses/NotImplemented' }
  /auth/verify-otp:
    post:
      operationId: EP-API-002
      summary: Verify the emailed OTP and activate the account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '501': { $ref: '#/components/responses/NotImplemented' }
  /auth/login:
    post:
      operationId: EP-API-003
      summary: Authenticate and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '501': { $ref: '#/components/responses/NotImplemented' }
  /auth/logout:
    post:
      operationId: EP-API-004
      summary: Revoke the current session token (adds it to the TokenBlacklist)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard:
    get:
      operationId: EP-API-005
      summary: Authenticated user's dashboard profile and Delete Account visibility flag (US-001)
      description: >
        Identity is taken only from the validated JWT (`sub`). Returns 401 UNAUTHORIZED for a
        missing/non-Bearer, expired, tampered or blacklisted token, a deleted/unknown account, or
        when the token blacklist (Redis) or PostgreSQL session store is unavailable (fail-secure).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Valid session
          headers:
            Server-Timing:
              description: AuthMiddleware session-validation duration, e.g. `auth;dur=1.23`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me:
    get:
      operationId: EP-API-008
      summary: Read-only account details (name, email, registration date, status) of the caller (US-005)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The authenticated user's own record
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/UserDTO' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: EP-API-006
      summary: Permanently delete the authenticated user's account (target derived from JWT only)
      security: [{ bearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /health:
    get:
      operationId: EP-API-007
      summary: Application and PostgreSQL health
      responses:
        '200':
          description: All dependencies reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: A dependency is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
